<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgRadial" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#181528"/>
      <stop offset="60%" stop-color="#0e0c17"/>
      <stop offset="100%" stop-color="#07060a"/>
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#3b2d54" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Monogram Gradient (Electric Violet to Flame Coral) -->
    <linearGradient id="monogramGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="35%" stop-color="#ec4899"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <linearGradient id="innerBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur1"/>
      <feGaussianBlur stdDeviation="36" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="105" fill="url(#bgRadial)"/>
  <rect x="16" y="16" width="480" height="480" rx="105" fill="none" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Ambient Glow Behind Monogram -->
  <circle cx="240" cy="260" r="120" fill="#a855f7" opacity="0.2" filter="url(#neonGlow)"/>
  <circle cx="280" cy="300" r="100" fill="#f97316" opacity="0.18" filter="url(#neonGlow)"/>

  <!-- Background decorative tech elements -->
  <g opacity="0.2" stroke="#8b5cf6" stroke-width="1.5">
    <path d="M 140 100 L 120 100 A 20 20 0 0 0 100 120 L 100 140" fill="none"/>
    <path d="M 372 100 L 392 100 A 20 20 0 0 1 412 120 L 412 140" fill="none"/>
    <path d="M 100 372 L 100 392 A 20 20 0 0 0 120 412 L 140 412" fill="none"/>
    <path d="M 412 372 L 412 392 A 20 20 0 0 1 392 412 L 372 412" fill="none"/>
    <!-- Center coordinate crosshairs -->
    <line x1="256" y1="70" x2="256" y2="85" stroke="#a855f7"/>
    <line x1="256" y1="427" x2="256" y2="442" stroke="#a855f7"/>
    <line x1="70" y1="256" x2="85" y2="256" stroke="#a855f7"/>
    <line x1="427" y1="256" x2="442" y2="256" stroke="#a855f7"/>
  </g>

  <!-- Lanius Monogram 'L' sculpted into a Shrike Head & Hooked Beak -->
  <g filter="url(#neonGlow)">
    <!-- Main Form: Bold, dynamic 'L' combined with the butcher bird's hooked beak grasping down -->
    <!-- The vertical stem rises up like a falcon's crest, curves sharply into the hooked beak at top, 
         while the horizontal base extends forward into a razor thorn blade -->
    <path d="
      M 160 120
      C 195 110, 245 118, 280 145
      C 305 165, 320 195, 315 225
      C 310 250, 285 270, 260 272
      C 278 262, 282 245, 278 232
      C 270 210, 245 200, 225 205
      L 225 315
      L 330 315
      C 355 315, 375 322, 390 340
      C 365 348, 340 350, 315 350
      L 225 350
      C 185 350, 160 325, 160 285
      Z
    " fill="url(#monogramGrad)"/>

    <!-- Sharp Beak Hook & Thorn Overlays for aggressive 3D silhouette -->
    <!-- Lower Thorn Point (Horizontal Base Barb) -->
    <path d="
      M 225 350
      L 365 350
      C 385 350, 405 342, 420 330
      C 400 358, 365 372, 325 372
      L 210 372
      C 180 372, 160 352, 160 320
      L 160 350
      Z
    " fill="#f97316" opacity="0.9"/>

    <!-- Sharp Predatory Beak Barb (Top Right Hook) -->
    <path d="
      M 265 170
      C 298 185, 335 220, 330 262
      C 325 292, 295 310, 275 318
      C 285 300, 290 280, 286 260
      C 280 235, 260 215, 240 205
      C 255 190, 262 178, 265 170
      Z
    " fill="#eab308" opacity="0.95"/>

    <!-- Intercepted Core: Glowing Diamond Beacon captured inside the beak fold -->
    <polygon points="295,240 315,255 295,270 275,255" fill="#ffffff" opacity="0.95"/>

    <!-- Bird's Piercing Eye (Observation / Proxy Monitoring) -->
    <circle cx="210" cy="168" r="8" fill="#0e0c17"/>
    <circle cx="210" cy="168" r="5" fill="#ffffff"/>
    <circle cx="212" cy="166" r="2" fill="#00ffff"/>
  </g>
</svg>
