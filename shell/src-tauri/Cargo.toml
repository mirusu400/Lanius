[package]
name = "lanius"
version = "0.3.0"
description = "Lanius web security proxy"
authors = ["Lanius"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "lanius_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# Downloads and installs a new build in place. The bundle carries the
# frozen engine with it, so a replaced bundle replaces both halves.
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["macros", "time"] }
getrandom = "0.3"

# Signal handling and process groups are POSIX only.
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSImage", "NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSError"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["WKWebView", "WKSnapshotConfiguration", "block2"] }
