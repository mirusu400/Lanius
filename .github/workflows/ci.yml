name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# A newer push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 3.13 or newer. On 3.12 mitmproxy pins typing-extensions<=4.14, which
  # collides with the pydantic that mcp requires, and pip spends minutes
  # searching before giving up.
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '22'

jobs:
  engine:
    name: Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: engine/requirements-dev.txt

      - name: Install dependencies
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Type check
        working-directory: engine
        run: python -m mypy

      - name: Tests
        working-directory: engine
        # Several tests bind local sockets and drive real HTTP servers, so they
        # need a little headroom on slower CI runners.
        timeout-minutes: 15
        # Report the slowest tests: a job that takes ten times as long on
        # one platform should say which test is responsible.
        run: python -m pytest -q --durations=10

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Type check
        working-directory: ui
        run: npm run typecheck

      - name: Lint
        working-directory: ui
        run: npm run lint

      - name: Tests (all locales)
        working-directory: ui
        # Runs the suite in English and Korean: assertions look strings up by
        # key, so a hardcoded string would fail one of the two passes.
        run: npm run test:locales

      - name: Build
        working-directory: ui
        run: npm run build

  shell:
    name: Shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell/src-tauri

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libgtk-3-dev

      # tauri's build script resolves bundle resources at compile time and
      # fails when the frozen engine is missing, so clippy and the tests
      # cannot run without one. Freezing the real engine here would add
      # several minutes to every push; the Rust code only ever looks the
      # binary up at runtime, so an empty file of the right name is enough.
      # The nightly workflow builds and ships the genuine engine.
      - name: Placeholder engine binary
        shell: bash
        run: |
          mkdir -p engine/dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            : > engine/dist/lanius-engine.exe
          else
            : > engine/dist/lanius-engine
          fi

      - name: Format check
        working-directory: shell/src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: shell/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: shell/src-tauri
        run: cargo test
