name: Nightly

# Runs after CI passes on main, not on a clock. A build a day meant the
# newest download could be up to 24 hours behind main, and a day where
# nothing was pushed still produced a release. Waiting on CI rather than
# on the push itself means a failing commit is never published, and CI
# is not run twice for the same commit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a prerelease instead of only uploading artifacts'
        type: boolean
        default: true

# A newer commit supersedes an in-flight build: the release always
# describes the tip of main, so finishing an older one is wasted work.
concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  meta:
    name: Resolve the commit
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      publish: ${{ steps.check.outputs.publish }}
      sha: ${{ steps.check.outputs.sha }}
      short_sha: ${{ steps.check.outputs.short_sha }}
      date: ${{ steps.check.outputs.date }}
    steps:
      - id: check
        env:
          # For a workflow_run the commit under test is the one CI ran
          # on, which is not necessarily the tip by the time this starts.
          EVENT: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          # `branches: [main]` matches the head branch, which for a pull
          # request is the source branch. A fork's branch called main
          # would otherwise publish itself over the real release.
          CI_EVENT: ${{ github.event.workflow_run.event }}
          PUBLISH: ${{ inputs.publish }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          FALLBACK_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha="${RUN_SHA:-$FALLBACK_SHA}"
          {
            echo "sha=$sha"
            echo "short_sha=${sha:0:7}"
            echo "date=$(date -u +%Y%m%d)"
          } >> "$GITHUB_OUTPUT"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "manual run: building $sha, publish=$PUBLISH"
            {
              echo "build=true"
              echo "publish=$PUBLISH"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Never ship a commit whose tests did not pass, and only ship
          # what was actually pushed to main.
          echo "CI ran on: $CI_EVENT, concluded: $CONCLUSION"
          # Decided here rather than in an `if:` expression, because a
          # wrong expression silently skips the job and shows nothing,
          # whereas this prints its reasoning and can be run locally.
          if [ "$CONCLUSION" = "success" ] && [ "$CI_EVENT" = "push" ]; then
            {
              echo "build=true"
              echo "publish=true"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "build=false"
              echo "publish=false"
            } >> "$GITHUB_OUTPUT"
          fi

  # A workflow_run already waited for CI. A manual run has not, so it
  # gets its own pass over the suite.
  verify:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.label }}
    needs: [meta, verify]
    # `verify` is skipped for a workflow_run, and a skipped dependency
    # would otherwise skip this too.
    if: >-
      ${{ !cancelled()
          && needs.meta.outputs.build == 'true'
          && needs.verify.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos-arm64
            bundles: app,dmg
          - os: macos-15-intel
            label: macos-x86_64
            bundles: app,dmg
          - os: ubuntu-22.04
            label: linux-x86_64
            bundles: appimage,deb
          - os: windows-latest
            label: windows-x86_64
            bundles: msi,nsis
    steps:
      - uses: actions/checkout@v7
        with:
          # Not the tip of main: build exactly what CI approved.
          ref: ${{ needs.meta.outputs.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell/src-tauri
          key: ${{ matrix.label }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libgtk-3-dev \
            libfuse2

      - name: Install engine dependencies
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Freeze the engine
        working-directory: engine
        env:
          # Stamped into the binary so a downloaded build can say which
          # commit it came from. Without these it would fall back to git,
          # which a user's machine does not have.
          LANIUS_BUILD_COMMIT: ${{ needs.meta.outputs.sha }}
          # The commit is part of the name because several builds now
          # land on the same day, and a date alone stopped telling them
          # apart.
          LANIUS_BUILD_RELEASE: >-
            nightly-${{ needs.meta.outputs.date }}-${{ needs.meta.outputs.short_sha }}
          LANIUS_BUILD_DATE: ${{ needs.meta.outputs.date }}
        run: pyinstaller --clean --noconfirm lanius-engine.spec

      - name: Smoke-test the frozen engine
        shell: bash
        env:
          LANIUS_DATA_DIR: ${{ runner.temp }}/lanius-smoke
        run: |
          set -euo pipefail

          # PyInstaller appends .exe on Windows.
          engine=./engine/dist/lanius-engine
          [ -x "$engine" ] || engine=./engine/dist/lanius-engine.exe

          "$engine" --proxy-port 18080 --api-port 18081 &
          engine_pid=$!
          trap 'kill "$engine_pid" 2>/dev/null || true' EXIT

          # The frozen binary needs a moment to unpack and bind.
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18081/api/status >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          status="$(curl -fsS http://127.0.0.1:18081/api/status)"
          echo "$status"
          echo "$status" | grep -q '"running":true'

          # The build stamp is the whole point of stamping it: a download
          # that cannot say which commit it is makes bug reports guesswork.
          about="$(curl -fsS http://127.0.0.1:18081/api/about)"
          echo "$about"
          echo "$about" | grep -qF '"commit_short":"${{ needs.meta.outputs.short_sha }}"'

          # The Windows bundle loads the UI from this WebView2 origin. A
          # missing CORS header makes a healthy engine look like it is down.
          curl -fsS -D - -o /dev/null \
            -H 'Origin: http://tauri.localhost' \
            http://127.0.0.1:18081/api/status \
            | grep -qiF 'access-control-allow-origin: http://tauri.localhost'

          # Prove the proxy actually captures traffic. The upstream status
          # does not matter (example.com/ci-smoke is a 404); what matters is
          # that the flow was recorded, so do not use curl -f here.
          curl -sS -x http://127.0.0.1:18080 http://example.com/ci-smoke -o /dev/null
          sleep 1
          curl -fsS 'http://127.0.0.1:18081/api/flows?search=ci-smoke' | grep -q ci-smoke
          echo 'engine smoke test passed'

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Install Tauri CLI
        working-directory: shell
        run: npm ci

      - name: Build the desktop bundle
        working-directory: shell
        shell: bash
        # macOS dmg bundling drives Finder over AppleScript and occasionally
        # loses a race with disk arbitration, so retry before failing the run.
        run: |
          set -euo pipefail
          build() {
            for attempt in 1 2 3; do
              if npx tauri build --bundles "$1"; then
                return 0
              fi
              echo "::warning::bundling '$1' failed (attempt $attempt), retrying"
              sleep 15
            done
            echo "::error::bundling '$1' failed after 3 attempts"
            return 1
          }

          # One target at a time, archiving each result immediately: macOS
          # dmg bundling deletes the .app it was built from, so anything left
          # for later would disappear.
          staging="${{ runner.temp }}/bundles"
          mkdir -p "$staging"
          bundle="src-tauri/target/release/bundle"

          IFS=',' read -ra targets <<< "${{ matrix.bundles }}"
          for target in "${targets[@]}"; do
            build "$target"
            if [ "$target" = "app" ]; then
              for app in "$bundle"/macos/*.app; do
                [ -d "$app" ] || continue
                name="$(basename "$app" .app)"
                tar -czf "$staging/${name}-${{ matrix.label }}.app.tar.gz" \
                  -C "$bundle/macos" "$(basename "$app")"
              done
            fi
          done

      - name: Collect artifacts
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          out="dist/${{ matrix.label }}"
          mkdir -p "$out"
          bundle="shell/src-tauri/target/release/bundle"

          # .app archives were staged during the build step, because dmg
          # bundling deletes the .app directory it was built from.
          staging="${{ runner.temp }}/bundles"
          if [ -d "$staging" ]; then
            find "$staging" -name '*.app.tar.gz' -exec cp {} "$out"/ \;
          fi

          # `rw.*.dmg` are create-dmg scratch images, not release artifacts.
          find "$bundle" -maxdepth 2 -type f \
            \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \
               -o -name '*.msi' -o -name '*-setup.exe' \) \
            ! -name 'rw.*.dmg' \
            -exec cp {} "$out"/ \;

          echo "--- collected ---"
          ls -la "$out"
          test -n "$(ls -A "$out")" || { echo 'no artifacts produced'; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: lanius-nightly-${{ matrix.label }}
          path: dist/${{ matrix.label }}/*
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish prerelease
    needs: [meta, build]
    # `!cancelled()` is load-bearing, and was what skipped this job on
    # the first two per-commit runs. `verify` is skipped for a
    # workflow_run; a skipped dependency skips `build`'s condition too
    # unless it is guarded, and that skip then reaches here. Confirmed
    # against this exact job graph: with the guard a skipped `verify`
    # still releases, and a single failed platform still does not.
    if: >-
      ${{ !cancelled()
          && needs.meta.outputs.publish == 'true'
          && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      # One rolling tag rather than one per day. Builds now happen per
      # commit, so dated tags would pile up several a day, and
      # /releases/latest/download/<file> only works if there is a single
      # moving target. The action updates the release but leaves the tag
      # where it was, so move it here.
      - name: Point the nightly tag at this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.meta.outputs.sha }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          if gh api "repos/$repo/git/ref/tags/nightly" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$repo/git/refs/tags/nightly" \
              -f sha="$SHA" -F force=true
          else
            gh api --method POST "repos/$repo/git/refs" \
              -f ref=refs/tags/nightly -f sha="$SHA"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ needs.meta.outputs.sha }}
          name: Nightly ${{ needs.meta.outputs.date }} (${{ needs.meta.outputs.short_sha }})
          body: |
            Built from
            [`${{ needs.meta.outputs.short_sha }}`](https://github.com/${{ github.repository }}/commit/${{ needs.meta.outputs.sha }})
            after CI passed. This release is replaced by every commit that
            lands on `main`, so it always matches the newest code.

            These builds are unsigned. On macOS remove the quarantine flag
            before the first launch:

            ```bash
            xattr -dr com.apple.quarantine /Applications/Lanius.app
            ```

            On Windows, SmartScreen warns about an unrecognised publisher:
            choose **More info** then **Run anyway**.

            Lanius is for security testing of systems you are authorised to
            test. Verifying that authorisation is your responsibility.
          prerelease: true
          files: dist/*
          fail_on_unmatched_files: true

      # Uploads replace files of the same name, so a bundle that changes
      # name (a version bump, a dropped platform) would otherwise stay on
      # the release forever, next to the current one, with nothing saying
      # which is which. Done after the upload: a failed run leaves the
      # previous build in place rather than an empty release.
      - name: Drop assets left over from an older build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(cd dist && ls)"
          gh release view nightly --json assets --jq '.assets[].name' \
          | while read -r asset; do
              if ! grep -qxF "$asset" <<< "$current"; then
                echo "removing stale asset: $asset"
                gh release delete-asset nightly "$asset" --yes
              fi
            done
