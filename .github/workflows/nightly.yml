name: Nightly

# Runs after CI passes on main, not on a clock. A build a day meant the
# newest download could be up to 24 hours behind main, and a day where
# nothing was pushed still produced a release. Waiting on CI rather than
# on the push itself means a failing commit is never published, and CI
# is not run twice for the same commit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a prerelease instead of only uploading artifacts'
        type: boolean
        default: true

# A newer commit supersedes an in-flight build: the release always
# describes the tip of main, so finishing an older one is wasted work.
concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  meta:
    name: Resolve the commit
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      publish: ${{ steps.check.outputs.publish }}
      sha: ${{ steps.check.outputs.sha }}
      short_sha: ${{ steps.check.outputs.short_sha }}
      date: ${{ steps.check.outputs.date }}
      version: ${{ steps.check.outputs.version }}
      msi_version: ${{ steps.check.outputs.msi_version }}
    steps:
      - id: check
        env:
          # For a workflow_run the commit under test is the one CI ran
          # on, which is not necessarily the tip by the time this starts.
          EVENT: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          # `branches: [main]` matches the head branch, which for a pull
          # request is the source branch. A fork's branch called main
          # would otherwise publish itself over the real release.
          CI_EVENT: ${{ github.event.workflow_run.event }}
          PUBLISH: ${{ inputs.publish }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          FALLBACK_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha="${RUN_SHA:-$FALLBACK_SHA}"
          {
            echo "sha=$sha"
            echo "short_sha=${sha:0:7}"
            echo "date=$(date -u +%Y%m%d)"
            # The in-app updater compares versions, and every build so far
            # called itself 0.1.0, which no comparison can separate. A
            # minute-stamped prerelease sorts by the only thing that
            # actually orders two nightlies: when they were built. It
            # also sorts below the next stable release itself, so a tagged
            # build still supersedes every nightly that preceded it.
            echo "version=0.2.1-nightly.$(date -u +%Y%m%dT%H%M)"
            # Windows installers take three numbers and nothing else, and
            # the number has to grow for an upgrade to be an upgrade.
            echo "msi_version=0.2.$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_OUTPUT"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "manual run: building $sha, publish=$PUBLISH"
            {
              echo "build=true"
              echo "publish=$PUBLISH"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Never ship a commit whose tests did not pass, and only ship
          # what was actually pushed to main.
          echo "CI ran on: $CI_EVENT, concluded: $CONCLUSION"
          # Decided here rather than in an `if:` expression, because a
          # wrong expression silently skips the job and shows nothing,
          # whereas this prints its reasoning and can be run locally.
          if [ "$CONCLUSION" = "success" ] && [ "$CI_EVENT" = "push" ]; then
            {
              echo "build=true"
              echo "publish=true"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "build=false"
              echo "publish=false"
            } >> "$GITHUB_OUTPUT"
            # A run that builds nothing still reports success, which
            # reads as "the nightly is up to date" when it is not. Say
            # on the run's own page why there is no new download.
            {
              echo "### No nightly published"
              echo
              echo "CI on \`${sha:0:7}\` was a **$CI_EVENT** that"
              echo "concluded **$CONCLUSION**, so there is nothing to"
              echo "release. Fix CI and the next commit publishes."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # A workflow_run already waited for CI. A manual run has not, so it
  # gets its own pass over the suite.
  verify:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.label }}
    needs: [meta, verify]
    # `verify` is skipped for a workflow_run, and a skipped dependency
    # would otherwise skip this too.
    if: >-
      ${{ !cancelled()
          && needs.meta.outputs.build == 'true'
          && needs.verify.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Absent until the repository has a signing key, and a build
      # without one still ships: it simply carries no updater, and the
      # app falls back to linking the download.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      # Empty when the key carries no password, which is the case here.
      # It still has to be set: an unset one makes the signer stop and
      # ask, and nobody is at the keyboard on a runner.
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos-arm64
            bundles: app,dmg
          - os: macos-15-intel
            label: macos-x86_64
            bundles: app,dmg
          - os: ubuntu-22.04
            label: linux-x86_64
            bundles: appimage,deb
          - os: windows-latest
            label: windows-x86_64
            bundles: msi,nsis
    steps:
      - uses: actions/checkout@v7
        with:
          # Not the tip of main: build exactly what CI approved.
          ref: ${{ needs.meta.outputs.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell/src-tauri
          key: ${{ matrix.label }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libgtk-3-dev \
            libfuse2

      - name: Install engine dependencies
        working-directory: engine
        env:
          # Intel macOS builds cryptography from source. Match the official
          # static wheels so its OpenSSL cannot collide with Python's older
          # libssl when PyInstaller collects both into the same directory.
          OPENSSL_STATIC: '1'
        run: |
          python -m pip install --upgrade pip
          # A wheel built with dynamic linking ignores the new build flag.
          python -m pip cache remove cryptography
          pip install -r requirements.txt pyinstaller

      - name: Freeze the engine
        working-directory: engine
        env:
          # Stamped into the binary so a downloaded build can say which
          # commit it came from. Without these it would fall back to git,
          # which a user's machine does not have.
          LANIUS_BUILD_COMMIT: ${{ needs.meta.outputs.sha }}
          # The commit is part of the name because several builds now
          # land on the same day, and a date alone stopped telling them
          # apart.
          LANIUS_BUILD_RELEASE: >-
            nightly-${{ needs.meta.outputs.date }}-${{ needs.meta.outputs.short_sha }}
          LANIUS_BUILD_DATE: ${{ needs.meta.outputs.date }}
        run: |
          python ../scripts/fetch_gost.py
          pyinstaller --clean --noconfirm lanius-engine.spec

      - name: Smoke-test the frozen engine
        shell: bash
        env:
          LANIUS_DATA_DIR: ${{ runner.temp }}/lanius-smoke
        run: |
          set -euo pipefail

          # The onedir build starts without unpacking on every launch.
          engine=./engine/dist/lanius-engine/lanius-engine
          if [ "$RUNNER_OS" = "Windows" ]; then
            engine="${engine}.exe"
          fi

          "$engine" --proxy-port 18080 --api-port 18081 &
          engine_pid=$!
          trap 'kill "$engine_pid" 2>/dev/null || true' EXIT

          # Allow time for first launch and API startup.
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18081/api/status >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          status="$(curl -fsS http://127.0.0.1:18081/api/status)"
          echo "$status"
          echo "$status" | grep -q '"running":true'

          # The build stamp is the whole point of stamping it: a download
          # that cannot say which commit it is makes bug reports guesswork.
          about="$(curl -fsS http://127.0.0.1:18081/api/about)"
          echo "$about"
          echo "$about" | grep -qF '"commit_short":"${{ needs.meta.outputs.short_sha }}"'

          # Update checks and remote wordlists import httpx only when used.
          # Inspect the frozen archive so a dev-only dependency cannot make
          # tests pass while leaving those features broken in the download.
          archive_listing="${RUNNER_TEMP}/lanius-engine-archive.txt"
          pyi-archive_viewer -r -l "$engine" > "$archive_listing"
          grep -q "'httpx'" "$archive_listing"

          # The Windows bundle loads the UI from this WebView2 origin. A
          # missing CORS header makes a healthy engine look like it is down.
          curl -fsS -D - -o /dev/null \
            -H 'Origin: http://tauri.localhost' \
            http://127.0.0.1:18081/api/status \
            | grep -qiF 'access-control-allow-origin: http://tauri.localhost'

          # Prove the proxy actually captures traffic. The upstream status
          # does not matter (example.com/ci-smoke is a 404); what matters is
          # that the flow was recorded, so do not use curl -f here.
          curl -sS -x http://127.0.0.1:18080 http://example.com/ci-smoke -o /dev/null
          sleep 1
          curl -fsS 'http://127.0.0.1:18081/api/flows?search=ci-smoke' | grep -q ci-smoke
          echo 'engine smoke test passed'

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Install Tauri CLI
        working-directory: shell
        run: npm ci

      # Only when there is a key to sign with. The updater refuses an
      # unsigned build, so an endpoint without a signature would be an
      # update nobody can install.
      - name: Configure the in-app updater
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        working-directory: shell/src-tauri
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          MSI_VERSION: ${{ needs.meta.outputs.msi_version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          with open("tauri.updater.conf.json", encoding="utf-8") as handle:
              config = json.load(handle)

          if not config["plugins"]["updater"]["pubkey"]:
              raise SystemExit(
                  "tauri.updater.conf.json has no public key: run "
                  "`npx tauri signer generate` and paste the public half in"
              )

          config["version"] = os.environ["VERSION"]
          config.setdefault("bundle", {}).setdefault("windows", {})["wix"] = {
              "version": os.environ["MSI_VERSION"]
          }

          with open("tauri.release.conf.json", "w", encoding="utf-8") as handle:
              json.dump(config, handle, indent=2)
          print(json.dumps(config, indent=2))
          PY

      - name: Build the desktop bundle
        working-directory: shell
        shell: bash
        # macOS dmg bundling drives Finder over AppleScript and occasionally
        # loses a race with disk arbitration, so retry before failing the run.
        run: |
          set -euo pipefail
          # Written by the previous step, and only when there is a key.
          config=()
          if [ -f src-tauri/tauri.release.conf.json ]; then
            config=(--config src-tauri/tauri.release.conf.json)
          fi

          build() {
            for attempt in 1 2 3; do
              if npx tauri build "${config[@]}" --bundles "$1"; then
                return 0
              fi
              echo "::warning::bundling '$1' failed (attempt $attempt), retrying"
              sleep 15
            done
            echo "::error::bundling '$1' failed after 3 attempts"
            return 1
          }

          # One target at a time, archiving each result immediately: macOS
          # dmg bundling deletes the .app it was built from, so anything left
          # for later would disappear.
          staging="${{ runner.temp }}/bundles"
          mkdir -p "$staging"
          bundle="src-tauri/target/release/bundle"

          IFS=',' read -ra targets <<< "${{ matrix.bundles }}"
          for target in "${targets[@]}"; do
            build "$target"
            if [ "$target" = "app" ]; then
              # With a signing key, tauri archives and signs the .app
              # itself, and that archive is what the signature covers.
              # Both architectures would otherwise land on one release as
              # Lanius.app.tar.gz, so the label goes into the name: a
              # signature is over the bytes, not over the file name.
              signed=0
              for archive in "$bundle"/macos/*.app.tar.gz; do
                [ -f "$archive" ] || continue
                name="$(basename "$archive" .app.tar.gz)"
                cp "$archive" "$staging/${name}-${{ matrix.label }}.app.tar.gz"
                if [ -f "$archive.sig" ]; then
                  cp "$archive.sig" "$staging/${name}-${{ matrix.label }}.app.tar.gz.sig"
                fi
                signed=1
              done
              if [ "$signed" = 0 ]; then
                for app in "$bundle"/macos/*.app; do
                  [ -d "$app" ] || continue
                  name="$(basename "$app" .app)"
                  tar -czf "$staging/${name}-${{ matrix.label }}.app.tar.gz" \
                    -C "$bundle/macos" "$(basename "$app")"
                done
              fi
            fi
          done

      - name: Collect artifacts
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          out="dist/${{ matrix.label }}"
          mkdir -p "$out"
          bundle="shell/src-tauri/target/release/bundle"

          # .app archives were staged during the build step, because dmg
          # bundling deletes the .app directory it was built from.
          staging="${{ runner.temp }}/bundles"
          if [ -d "$staging" ]; then
            find "$staging" \
              \( -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) \
              -exec cp {} "$out"/ \;
          fi

          # `rw.*.dmg` are create-dmg scratch images, not release artifacts.
          # The `.sig` files are what the in-app updater checks the
          # download against, so they ship next to what they sign.
          find "$bundle" -maxdepth 2 -type f \
            \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \
               -o -name '*.msi' -o -name '*-setup.exe' \
               -o -name '*.AppImage.sig' -o -name '*.msi.sig' \
               -o -name '*-setup.exe.sig' \) \
            ! -name 'rw.*.dmg' \
            -exec cp {} "$out"/ \;

          echo "--- collected ---"
          ls -la "$out"
          test -n "$(ls -A "$out")" || { echo 'no artifacts produced'; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: lanius-nightly-${{ matrix.label }}
          path: dist/${{ matrix.label }}/*
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish prerelease
    needs: [meta, build]
    # `!cancelled()` is load-bearing, and was what skipped this job on
    # the first two per-commit runs. `verify` is skipped for a
    # workflow_run; a skipped dependency skips `build`'s condition too
    # unless it is guarded, and that skip then reaches here. Confirmed
    # against this exact job graph: with the guard a skipped `verify`
    # still releases, and a single failed platform still does not.
    if: >-
      ${{ !cancelled()
          && needs.meta.outputs.publish == 'true'
          && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      # What the in-app updater reads. It is a release asset like any
      # other, at a URL that does not move, because the `nightly` tag
      # does not move either. Written from what was actually built: a
      # platform whose bundle is missing simply is not offered an
      # update, which is better than offering one that 404s.
      - name: Write the update manifest
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          SHA: ${{ needs.meta.outputs.sha }}
          SHORT_SHA: ${{ needs.meta.outputs.short_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          dist = Path("dist")
          repo = os.environ["REPO"]

          # The updater's own names for the platforms, each mapped to the
          # artifact it knows how to install. A .deb cannot update itself,
          # so Debian packages are absent on purpose.
          wanted = {
              "darwin-aarch64": "macos-arm64.app.tar.gz",
              "darwin-x86_64": "macos-x86_64.app.tar.gz",
              "linux-x86_64": ".AppImage",
              "windows-x86_64": "-setup.exe",
          }

          platforms = {}
          for target, suffix in wanted.items():
              for path in sorted(dist.iterdir()):
                  if not path.name.endswith(suffix):
                      continue
                  signature = path.with_name(path.name + ".sig")
                  if not signature.exists():
                      print(f"{path.name}: no signature, skipping {target}")
                      continue
                  platforms[target] = {
                      "signature": signature.read_text(encoding="utf-8").strip(),
                      "url": (
                          f"https://github.com/{repo}/releases/download/"
                          f"nightly/{path.name}"
                      ),
                  }
                  break

          if not platforms:
              # No signing key in this repository yet: the app still says
              # a newer build exists and links to it.
              print("no signed bundles, so no update manifest")
              raise SystemExit(0)

          manifest = {
              "version": os.environ["VERSION"],
              "notes": (
                  "Built from "
                  f"{os.environ['SHORT_SHA']} after CI passed."
              ),
              "pub_date": datetime.now(timezone.utc)
              .isoformat(timespec="seconds")
              .replace("+00:00", "Z"),
              "platforms": platforms,
          }
          (dist / "latest.json").write_text(
              json.dumps(manifest, indent=2), encoding="utf-8"
          )
          print(json.dumps(manifest, indent=2))
          PY

      # One rolling tag rather than one per day. Builds now happen per
      # commit, so dated tags would pile up several a day, and
      # /releases/latest/download/<file> only works if there is a single
      # moving target. The action updates the release but leaves the tag
      # where it was, so move it here.
      - name: Point the nightly tag at this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.meta.outputs.sha }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          if gh api "repos/$repo/git/ref/tags/nightly" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$repo/git/refs/tags/nightly" \
              -f sha="$SHA" -F force=true
          else
            gh api --method POST "repos/$repo/git/refs" \
              -f ref=refs/tags/nightly -f sha="$SHA"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ needs.meta.outputs.sha }}
          name: Nightly ${{ needs.meta.outputs.date }} (${{ needs.meta.outputs.short_sha }})
          body: |
            Built from
            [`${{ needs.meta.outputs.short_sha }}`](https://github.com/${{ github.repository }}/commit/${{ needs.meta.outputs.sha }})
            after CI passed. This release is replaced by every commit that
            lands on `main`, so it always matches the newest code.

            These builds are unsigned. On macOS remove the quarantine flag
            before the first launch:

            ```bash
            xattr -dr com.apple.quarantine /Applications/Lanius.app
            ```

            On Windows, SmartScreen warns about an unrecognised publisher:
            choose **More info** then **Run anyway**.

            Lanius is for security testing of systems you are authorised to
            test. Verifying that authorisation is your responsibility.
          prerelease: true
          files: dist/*
          fail_on_unmatched_files: true

      # Uploads replace files of the same name, so a bundle that changes
      # name (a version bump, a dropped platform) would otherwise stay on
      # the release forever, next to the current one, with nothing saying
      # which is which. Done after the upload: a failed run leaves the
      # previous build in place rather than an empty release.
      - name: Drop assets left over from an older build
        env:
          GH_TOKEN: ${{ github.token }}
          # gh works out the repository from the git remote, and this job
          # never checks anything out.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          current="$(cd dist && ls)"
          gh release view nightly --json assets --jq '.assets[].name' \
          | while read -r asset; do
              if ! grep -qxF "$asset" <<< "$current"; then
                echo "removing stale asset: $asset"
                gh release delete-asset nightly "$asset" --yes
              fi
            done
