name: Stable release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: stable-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  meta:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      date: ${{ steps.version.outputs.date }}
      version: ${{ steps.version.outputs.version }}
      msi_version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import tomllib
          from datetime import datetime, timezone
          from pathlib import Path

          tag = os.environ["TAG"]
          if not re.fullmatch(r"v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", tag):
              raise SystemExit(f"expected a stable version tag, got {tag!r}")
          version = tag[1:]
          engine_version = re.search(
              r'^__version__ = "([^"]+)"$',
              Path("engine/app/__init__.py").read_text(encoding="utf-8"),
              re.MULTILINE,
          )
          versions = {
              "engine/app/__init__.py": engine_version.group(1) if engine_version else None,
              "shell/src-tauri/tauri.conf.json": json.loads(
                  Path("shell/src-tauri/tauri.conf.json").read_text(encoding="utf-8")
              )["version"],
              "shell/src-tauri/Cargo.toml": tomllib.loads(
                  Path("shell/src-tauri/Cargo.toml").read_text(encoding="utf-8")
              )["package"]["version"],
              "shell/package.json": json.loads(
                  Path("shell/package.json").read_text(encoding="utf-8")
              )["version"],
          }
          for filename, actual in versions.items():
              if actual != version:
                  raise SystemExit(f"{filename}: expected {version}, found {actual}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"sha={os.environ['SHA']}\n")
              output.write(f"short_sha={os.environ['SHA'][:7]}\n")
              output.write(f"date={datetime.now(timezone.utc):%Y%m%d}\n")
              output.write(f"version={version}\n")
          PY

  verify:
    name: Run CI for the tag
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.label }}
    needs: [meta, verify]
    if: >-
      ${{ !cancelled()
          && needs.meta.result == 'success'
          && needs.verify.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Stable releases require signed updater artifacts on every platform.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      # Empty when the key carries no password, which is the case here.
      # It still has to be set: an unset one makes the signer stop and
      # ask, and nobody is at the keyboard on a runner.
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos-arm64
            bundles: app,dmg
          - os: macos-15-intel
            label: macos-x86_64
            bundles: app,dmg
          - os: ubuntu-22.04
            label: linux-x86_64
            bundles: appimage,deb
          - os: windows-latest
            label: windows-x86_64
            bundles: msi,nsis
    steps:
      - name: Require updater signing key
        if: env.TAURI_SIGNING_PRIVATE_KEY == ''
        run: exit 1

      - uses: actions/checkout@v7
        with:
          # Not the tip of main: build exactly what CI approved.
          ref: ${{ needs.meta.outputs.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell/src-tauri
          key: ${{ matrix.label }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libgtk-3-dev \
            libfuse2

      - name: Install engine dependencies
        working-directory: engine
        env:
          # Intel macOS builds cryptography from source. Match the official
          # static wheels so its OpenSSL cannot collide with Python's older
          # libssl when PyInstaller collects both into the same directory.
          OPENSSL_STATIC: '1'
        run: |
          python -m pip install --upgrade pip
          # A wheel built with dynamic linking ignores the new build flag.
          python -m pip cache remove cryptography
          pip install -r requirements.txt pyinstaller

      - name: Freeze the engine
        working-directory: engine
        env:
          # Stamped into the binary so a downloaded build can say which
          # commit it came from. Without these it would fall back to git,
          # which a user's machine does not have.
          LANIUS_BUILD_COMMIT: ${{ needs.meta.outputs.sha }}
          # The commit is part of the name because several builds now
          # land on the same day, and a date alone stopped telling them
          # apart.
          LANIUS_BUILD_RELEASE: >-
            ${{ github.ref_name }}
          LANIUS_BUILD_DATE: ${{ needs.meta.outputs.date }}
        run: |
          python ../scripts/fetch_gost.py
          pyinstaller --clean --noconfirm lanius-engine.spec

      - name: Smoke-test the frozen engine
        shell: bash
        env:
          LANIUS_DATA_DIR: ${{ runner.temp }}/lanius-smoke
        run: |
          set -euo pipefail

          # The onedir build starts without unpacking on every launch.
          engine=./engine/dist/lanius-engine/lanius-engine
          if [ "$RUNNER_OS" = "Windows" ]; then
            engine="${engine}.exe"
          fi

          "$engine" --proxy-port 18080 --api-port 18081 &
          engine_pid=$!
          trap 'kill "$engine_pid" 2>/dev/null || true' EXIT

          # Allow time for first launch and API startup.
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18081/api/status >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          status="$(curl -fsS http://127.0.0.1:18081/api/status)"
          echo "$status"
          echo "$status" | grep -q '"running":true'

          # The build stamp is the whole point of stamping it: a download
          # that cannot say which commit it is makes bug reports guesswork.
          about="$(curl -fsS http://127.0.0.1:18081/api/about)"
          echo "$about"
          echo "$about" | grep -qF '"commit_short":"${{ needs.meta.outputs.short_sha }}"'

          # Update checks and remote wordlists import httpx only when used.
          # Inspect the frozen archive so a dev-only dependency cannot make
          # tests pass while leaving those features broken in the download.
          archive_listing="${RUNNER_TEMP}/lanius-engine-archive.txt"
          pyi-archive_viewer -r -l "$engine" > "$archive_listing"
          grep -q "'httpx'" "$archive_listing"

          # The Windows bundle loads the UI from this WebView2 origin. A
          # missing CORS header makes a healthy engine look like it is down.
          curl -fsS -D - -o /dev/null \
            -H 'Origin: http://tauri.localhost' \
            http://127.0.0.1:18081/api/status \
            | grep -qiF 'access-control-allow-origin: http://tauri.localhost'

          # Prove the proxy actually captures traffic. The upstream status
          # does not matter (example.com/ci-smoke is a 404); what matters is
          # that the flow was recorded, so do not use curl -f here.
          curl -sS -x http://127.0.0.1:18080 http://example.com/ci-smoke -o /dev/null
          sleep 1
          curl -fsS 'http://127.0.0.1:18081/api/flows?search=ci-smoke' | grep -q ci-smoke
          echo 'engine smoke test passed'

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Install Tauri CLI
        working-directory: shell
        run: npm ci

      # Only when there is a key to sign with. The updater refuses an
      # unsigned build, so an endpoint without a signature would be an
      # update nobody can install.
      - name: Configure the in-app updater
        working-directory: shell/src-tauri
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          MSI_VERSION: ${{ needs.meta.outputs.msi_version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          with open("tauri.updater.conf.json", encoding="utf-8") as handle:
              config = json.load(handle)

          if not config["plugins"]["updater"]["pubkey"]:
              raise SystemExit(
                  "tauri.updater.conf.json has no public key: run "
                  "`npx tauri signer generate` and paste the public half in"
              )

          config["version"] = os.environ["VERSION"]
          config["plugins"]["updater"]["endpoints"] = [
              "https://github.com/mirusu400/Lanius/releases/latest/download/latest.json"
          ]
          config.setdefault("bundle", {}).setdefault("windows", {})["wix"] = {
              "version": os.environ["MSI_VERSION"]
          }

          with open("tauri.release.conf.json", "w", encoding="utf-8") as handle:
              json.dump(config, handle, indent=2)
          print(json.dumps(config, indent=2))
          PY

      - name: Build the desktop bundle
        working-directory: shell
        shell: bash
        # macOS dmg bundling drives Finder over AppleScript and occasionally
        # loses a race with disk arbitration, so retry before failing the run.
        run: |
          set -euo pipefail
          # Written by the previous step, and only when there is a key.
          config=()
          if [ -f src-tauri/tauri.release.conf.json ]; then
            config=(--config src-tauri/tauri.release.conf.json)
          fi

          build() {
            for attempt in 1 2 3; do
              if npx tauri build "${config[@]}" --bundles "$1"; then
                return 0
              fi
              echo "::warning::bundling '$1' failed (attempt $attempt), retrying"
              sleep 15
            done
            echo "::error::bundling '$1' failed after 3 attempts"
            return 1
          }

          # One target at a time, archiving each result immediately: macOS
          # dmg bundling deletes the .app it was built from, so anything left
          # for later would disappear.
          staging="${{ runner.temp }}/bundles"
          mkdir -p "$staging"
          bundle="src-tauri/target/release/bundle"

          IFS=',' read -ra targets <<< "${{ matrix.bundles }}"
          for target in "${targets[@]}"; do
            build "$target"
            if [ "$target" = "app" ]; then
              # With a signing key, tauri archives and signs the .app
              # itself, and that archive is what the signature covers.
              # Both architectures would otherwise land on one release as
              # Lanius.app.tar.gz, so the label goes into the name: a
              # signature is over the bytes, not over the file name.
              signed=0
              for archive in "$bundle"/macos/*.app.tar.gz; do
                [ -f "$archive" ] || continue
                name="$(basename "$archive" .app.tar.gz)"
                cp "$archive" "$staging/${name}-${{ matrix.label }}.app.tar.gz"
                if [ -f "$archive.sig" ]; then
                  cp "$archive.sig" "$staging/${name}-${{ matrix.label }}.app.tar.gz.sig"
                fi
                signed=1
              done
              if [ "$signed" = 0 ]; then
                for app in "$bundle"/macos/*.app; do
                  [ -d "$app" ] || continue
                  name="$(basename "$app" .app)"
                  tar -czf "$staging/${name}-${{ matrix.label }}.app.tar.gz" \
                    -C "$bundle/macos" "$(basename "$app")"
                done
              fi
            fi
          done

      - name: Collect artifacts
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          out="dist/${{ matrix.label }}"
          mkdir -p "$out"
          bundle="shell/src-tauri/target/release/bundle"

          # .app archives were staged during the build step, because dmg
          # bundling deletes the .app directory it was built from.
          staging="${{ runner.temp }}/bundles"
          if [ -d "$staging" ]; then
            find "$staging" \
              \( -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) \
              -exec cp {} "$out"/ \;
          fi

          # `rw.*.dmg` are create-dmg scratch images, not release artifacts.
          # The `.sig` files are what the in-app updater checks the
          # download against, so they ship next to what they sign.
          find "$bundle" -maxdepth 2 -type f \
            \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \
               -o -name '*.msi' -o -name '*-setup.exe' \
               -o -name '*.AppImage.sig' -o -name '*.msi.sig' \
               -o -name '*-setup.exe.sig' \) \
            ! -name 'rw.*.dmg' \
            -exec cp {} "$out"/ \;

          echo "--- collected ---"
          ls -la "$out"
          test -n "$(ls -A "$out")" || { echo 'no artifacts produced'; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: lanius-stable-${{ matrix.label }}
          path: dist/${{ matrix.label }}/*
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish stable release
    needs: [meta, verify, build]
    if: >-
      ${{ !cancelled()
          && needs.meta.result == 'success'
          && needs.verify.result == 'success'
          && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Check release notes
        env:
          TAG: ${{ github.ref_name }}
        run: test -s "docs/releases/${TAG}.md"

      # Publish only when every platform has a signed updater bundle.
      - name: Write the update manifest
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          SHA: ${{ needs.meta.outputs.sha }}
          SHORT_SHA: ${{ needs.meta.outputs.short_sha }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          dist = Path("dist")
          repo = os.environ["REPO"]

          # The updater's own names for the platforms, each mapped to the
          # artifact it knows how to install. A .deb cannot update itself,
          # so Debian packages are absent on purpose.
          wanted = {
              "darwin-aarch64": "macos-arm64.app.tar.gz",
              "darwin-x86_64": "macos-x86_64.app.tar.gz",
              "linux-x86_64": ".AppImage",
              "windows-x86_64": "-setup.exe",
          }

          platforms = {}
          for target, suffix in wanted.items():
              for path in sorted(dist.iterdir()):
                  if not path.name.endswith(suffix):
                      continue
                  signature = path.with_name(path.name + ".sig")
                  if not signature.exists():
                      print(f"{path.name}: no signature, skipping {target}")
                      continue
                  platforms[target] = {
                      "signature": signature.read_text(encoding="utf-8").strip(),
                      "url": (
                          f"https://github.com/{repo}/releases/download/"
                          f"{os.environ['TAG']}/{path.name}"
                      ),
                  }
                  break

          if len(platforms) != len(wanted):
              raise SystemExit(f"missing signed updater bundles: {set(wanted) - set(platforms)}")

          manifest = {
              "version": os.environ["VERSION"],
              "notes": (
                  "Built from "
                  f"{os.environ['SHORT_SHA']} after CI passed."
              ),
              "pub_date": datetime.now(timezone.utc)
              .isoformat(timespec="seconds")
              .replace("+00:00", "Z"),
              "platforms": platforms,
          }
          (dist / "latest.json").write_text(
              json.dumps(manifest, indent=2), encoding="utf-8"
          )
          print(json.dumps(manifest, indent=2))
          PY

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Lanius ${{ needs.meta.outputs.version }}
          body_path: docs/releases/${{ github.ref_name }}.md
          prerelease: false
          make_latest: true
          files: dist/*
          fail_on_unmatched_files: true
